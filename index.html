function drawFrom(deck, count) {
  const pool = [...deck];
  const out = [];
  for (let i = 0; i < count; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}

  { label: "What's Blocking You", color: "#e05a78" },

function GlitterLayer({ count = 35 }) {
  const [dots] = useState(() =>
    Array.from({ length: count }, () => ({
      left: Math.random() * 100,
      top: Math.random() * 100,
      size: Math.random() * 2.2 + 0.8,
      delay: Math.random() * 4,
      duration: Math.random() * 2.5 + 1.5,
      teal: Math.random() > 0.35,
    }))
  );
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none" }}>
      {dots.map((d, i) => (
        <div
          key={i}
          style={{
            position: "absolute",
            left: `${d.left}%`,
            top: `${d.top}%`,
            width: d.size,
            height: d.size,
            borderRadius: "50%",
            background: d.teal ? "#4dd8cc" : "#f5f6fa",
            boxShadow: `0 0 ${d.size * 2.5}px ${d.teal ? "#4dd8cc" : "#f5f6fa"}`,
            animation: `glimmer ${d.duration}s ease-in-out ${d.delay}s infinite`,
          }}
        />
      ))}
      <style>{`@keyframes glimmer { 0%,100% { opacity:0; transform:scale(0.4);} 50% { opacity:1; transform:scale(1.3);} }`}</style>

  );
}

function TarotDraw() {
  const [stage, setStage] = useState("intro");
  const [goal, setGoal] = useState("");
  const [hsv, setHsv] = useState({ vision: "" });
  const [pairs, setPairs] = useState([]);
  const [reading, setReading] = useState(null);
  const [meditation, setMeditation] = useState(null);
  const [meditationParts, setMeditationParts] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [unlocked, setUnlocked] = useState(false);
  const [emailInput, setEmailInput] = useState("");
  const [nameInput, setNameInput] = useState("");
  const [oathChecked, setOathChecked] = useState(false);
  const [savedCode, setSavedCode] = useState(null);
  const [tonePlaying, setTonePlaying] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [voiceLoading, setVoiceLoading] = useState(false);
  const [voiceError, setVoiceError] = useState(null);
  const [toneVolume, setToneVolume] = useState(0.36); // 40% lower than the original 0.6 default

  const audioCtxRef = useRef(null);
  const oscRef = useRef(null);
  const gainRef = useRef(null);
  const audioElRef = useRef(null);
  const speechAudioRef = useRef(null);
  const speechUrlRef = useRef(null);
  const speechTimeoutRef = useRef(null);
  const stopFlagRef = useRef(false);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code = params.get("m");
    if (code) {
      window.storage
        .get(`meditation:${code}`, false)
        .then((res) => {
          if (res && res.value) {
            const saved = JSON.parse(res.value);
            setGoal(saved.goal);
            setReading(saved.reading);
            setMeditation(saved.meditation);
            setMeditationParts(saved.meditationParts || null);
            setSavedCode(code);
            setUnlocked(true);
            setStage("meditation");
          }
        })
        .catch(() => {});
    }
  }, []);

  useEffect(() => {
    return () => {
      if (oscRef.current) oscRef.current.stop();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    };
  }, []);

  function startDraw(finalIdentity) {
    setGoal(finalIdentity);
    const majors = drawFrom(MAJOR, 2);
    const minors = drawFrom(MINOR, 6);
    const drawnPairs = [
      [majors[0], minors[0]],
      [minors[1], minors[2]],
      [minors[3], minors[4]],
      [majors[1], minors[5]],
    ];
    setPairs(drawnPairs);
    setStage("reveal");
  }

  async function submitEmailGate() {
    if (ZAPIER_WEBHOOK_URL) {
      try {
        await fetch(ZAPIER_WEBHOOK_URL, {
          method: "POST",
          body: JSON.stringify({ name: nameInput, email: emailInput, identity: goal, source: "tarot-draw" }),
        });
      } catch (e) {
        // don't block the user's experience if this fails silently
      }
    }
    generateReading(goal);
  }

  async function generateReading(identity) {
    setLoading(true);
    setError(null);
    setStage("reading");
    const cardList = pairs
      .map((pair, i) => `${STEPS[i].label}: ${pair.map((c) => `${c.n} (${c.k})`).join(" + ")}`)
      .join("\n");

    const prompt = `You are writing in the voice of "The Magician's Path" — an esoteric identity-transformation brand built on tarot archetypes, chakra ascension through alchemy, and a framework of "Curses" (specific blocks like Identity Vacuum, Soul Bind, False Beliefs, Energy Leakage) that keep someone from full expression. Voice: direct, warm, confident, spiritually serious but not stiff.

The identity the person wants to become: "${identity}"

Four card pairs were drawn:
${cardList}

Respond ONLY with a JSON object, no markdown, no preamble:
{
  "archetype": "A personalized interpretation of the 'Your Archetype' card pair (${pairs[0].map((c) => c.n).join(" and ")}), addressing the reader as 'you', tied to their stated identity. 45-60 words.",
  "blocking": "A personalized interpretation of the 'What's Blocking You' card pair (${pairs[1].map((c) => c.n).join(" and ")}). 45-60 words.",
  "pathForward": "A personalized interpretation of the 'The Path Forward' card pair (${pairs[2].map((c) => c.n).join(" and ")}), tying the solution to healing the inner child and the alchemy of stepping into a higher identity. 45-60 words.",
  "whoYouBecome": "A personalized interpretation of the 'Who You Become' card pair (${pairs[3].map((c) => c.n).join(" and ")}). 45-60 words.",
  "visualization": "The centerpiece of a guided visualization, second person, present tense, calm hypnotic pacing with natural pauses written as ellipses. Describe the person vividly embodying the identity '${identity}', informed by the Who You Become card pair (${pairs[3].map((c) => c.n).join(" and ")}). Structure it in this exact order: (1) See this version of themselves clearly, feeling it fully. (2) Take a deep breath and release all need or desire for a specific outcome, feeling that reality settle into their bones. (3) They turn and see a child standing nearby, watching them in awe — they realize it is themselves, no older than eight years old. They walk toward the child, embrace them slowly, and the two merge until they are one single person. (4) From there, they are fully this new identity now, completely embodied. About 200-240 words. Do not include any counting, breathing instructions, eyes-opening language, session-closing language, or any mention of the number 888 — those are all handled separately."
}`;

    try {
      const response = await fetch(WORKER_URL || "https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1400,
          messages: [{ role: "user", content: prompt }],
        }),
      });
      const data = await response.json();
      const text = data.content.map((b) => b.text || "").join("");
      const clean = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      setReading({
        archetype: parsed.archetype,
        blocking: parsed.blocking,
        pathForward: parsed.pathForward,
        whoYouBecome: parsed.whoYouBecome,
      });

      const inductionPre = `Before we begin — make sure you are not operating any machinery, and that you are seated safely in a quiet space.

When you're ready, close your eyes.

Take a slow breath in... and let it out.

Now, count slowly to eight with me. With each number, feel your eyelids grow heavier... heavier... as if they are made of stone.`;

      const inductionCount = `One... two... three... four... five... six... seven... eight.`;

      const inductionPost = `By now, they may feel too heavy to open. Try, gently — and notice just how heavy they've become.`;

      const voidLight = `Imagine yourself inside a black void. But it isn't empty — it's warm. Comforting. Completely safe. You are held here, fully, by love itself.

In the distance, a single point of light appears. Bright white. Slowly, it begins to move toward you.

It grows brighter... and brighter... until it completely surrounds you, consuming you entirely in its light.

Feel its warmth now — not just on your skin, but inside you. Inside every cell of your body. Healing, as it moves through you.

...Silence.`;

      const anchor = `From this moment forward — anytime you say the number eight, eight, eight, or hear it spoken by someone else, this exact feeling becomes immediately available to you again.`;

      const closingPre = `Now, let's count back to eight together. With each number, you'll rise gently back into this moment — still holding everything you just became.`;

      const closingCount = `One... two... three... four... five... six... seven... eight.`;

      const closingPost = `Open your eyes. Take a deep breath.`;

      const reminder = `Repeat this practice daily, for the next eight days. Make sure to save this page's link, so you can return to it — and to this exact meditation — every day.`;

      const reciprocity = `This was given to you freely. If it moved something in you, consider offering eight dollars and eighty-eight cents back into the exchange. The law of reciprocity helps the universe respond to your own desires, and the number eight, eight, eight carries a resonance that summons your higher self.`;

      const induction = `${inductionPre}\n\n${inductionCount}\n\n${inductionPost}`;
      const closing = `${closingPre}\n\n${closingCount}\n\n${closingPost}`;

      const fullMeditation = [induction, voidLight, parsed.visualization, anchor, closing, reminder, reciprocity].join("\n\n");
      const parts = { inductionPre, inductionCount, inductionPost, voidLight, visualization: parsed.visualization, anchor, closingPre, closingCount, closingPost, reminder, reciprocity };

      setMeditation(fullMeditation);
      setMeditationParts(parts);

      const code = Math.random().toString(36).slice(2, 8);
      try {
        await window.storage.set(
          `meditation:${code}`,
          JSON.stringify({ goal, reading: parsed, meditation: fullMeditation, meditationParts: parts, email: emailInput, name: nameInput }),
          false
        );
        setSavedCode(code);
        const url = new URL(window.location.href);
        url.searchParams.set("m", code);
        window.history.replaceState({}, "", url);
      } catch (e) {}
    } catch (e) {
      setError("The reading couldn't be generated. Try again in a moment.");
    } finally {
      setLoading(false);
    }
  }

  function startTone() {
    if (CUSTOM_TONE_URL) {
      const audio = new Audio(CUSTOM_TONE_URL);
      audio.loop = true;
      audio.volume = 0;
      audio.play();
      let v = 0;
      const fade = setInterval(() => {
        v += toneVolume / 20;
        audio.volume = Math.min(v, toneVolume);
        if (v >= toneVolume) clearInterval(fade);
      }, 80);
      audioElRef.current = audio;
      setTonePlaying(true);
      return;
    }
    if (!audioCtxRef.current) {
      audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    const ctx = audioCtxRef.current;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 432;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(toneVolume * 0.06, ctx.currentTime + 2.5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    oscRef.current = osc;
    gainRef.current = gain;
    setTonePlaying(true);
  }

  function handleVolumeChange(newVal) {
    setToneVolume(newVal);
    if (audioElRef.current) {
      audioElRef.current.volume = newVal;
    }
    if (gainRef.current && audioCtxRef.current) {
      gainRef.current.gain.setValueAtTime(newVal * 0.06, audioCtxRef.current.currentTime);
    }
  }

  function stopTone() {
    if (audioElRef.current) {
      audioElRef.current.pause();
      audioElRef.current = null;
    }
    if (oscRef.current) {
      const ctx = audioCtxRef.current;
      const gain = gainRef.current;
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
      const osc = oscRef.current;
      setTimeout(() => {
        osc.stop();
        osc.disconnect();
      }, 650);
      oscRef.current = null;
    }
    setTonePlaying(false);
  }

  function wait(ms) {
    return new Promise((resolve) => {
      speechTimeoutRef.current = setTimeout(resolve, ms);
    });
  }

  async function speakClip(text) {
    const startedAt = Date.now();
    const response = await fetch(`${WORKER_URL}/tts`, {
      method: "POST",
      body: JSON.stringify({ text, voiceId: ELEVENLABS_VOICE_ID }),
    });
    if (!response.ok) {
      const errText = await response.text();
      console.error("TTS request failed:", response.status, errText);
      throw new Error(`Voice failed to load (status ${response.status}). Check the ElevenLabs key in your Worker.`);
    }
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    speechUrlRef.current = url;
    const audio = new Audio(url);
    speechAudioRef.current = audio;
    setVoiceLoading(false);
    await new Promise((resolve) => {
      audio.onended = resolve;
      audio.play();
    });
    URL.revokeObjectURL(url);
    return Date.now() - startedAt;
  }

  async function speakClipMinDuration(text, minMs) {
    const elapsed = await speakClip(text);
    if (elapsed < minMs) {
      await wait(minMs - elapsed);
    }
  }

  async function speakMeditation() {
    setVoiceError(null);
    setSpeaking(true);
    setVoiceLoading(true);
    stopFlagRef.current = false;

    const parts = meditationParts;
    const beats = parts
      ? [
          { type: "speak", text: parts.inductionPre },
          { type: "pause", ms: 1500 },
          { type: "speakMin", text: parts.inductionCount, ms: 8000 },
          { type: "pause", ms: 1200 },
          { type: "speak", text: parts.inductionPost },
          { type: "pause", ms: 2500 },
          { type: "speak", text: parts.voidLight },
          { type: "pause", ms: 3500 },
          { type: "speak", text: parts.visualization },
          { type: "pause", ms: 1800 },
          { type: "speak", text: parts.anchor },
          { type: "pause", ms: 2000 },
          { type: "speak", text: parts.closingPre },
          { type: "pause", ms: 1200 },
          { type: "speakMin", text: parts.closingCount, ms: 8000 },
          { type: "pause", ms: 1000 },
          { type: "speak", text: parts.closingPost },
          { type: "pause", ms: 2000 },
          { type: "speak", text: parts.reminder },
          { type: "pause", ms: 1800 },
          { type: "speak", text: parts.reciprocity },
        ]
      : meditation.split(/\n\n+/).filter((s) => s.trim()).map((text) => ({ type: "speak", text }));

    try {
      for (const beat of beats) {
        if (stopFlagRef.current) break;
        if (beat.type === "pause") {
          await wait(beat.ms);
        } else if (beat.type === "speakMin") {
          await speakClipMinDuration(beat.text, beat.ms);
        } else {
          await speakClip(beat.text);
        }
      }
    } catch (e) {
      setVoiceError(e.message || "Voice failed to play. Check your connection and try again.");
    } finally {
      setSpeaking(false);
      setVoiceLoading(false);
    }
  }

  function stopSpeaking() {
    stopFlagRef.current = true;
    if (speechTimeoutRef.current) {
      clearTimeout(speechTimeoutRef.current);
      speechTimeoutRef.current = null;
    }
    if (speechAudioRef.current) {
      speechAudioRef.current.pause();
      speechAudioRef.current = null;
    }
    if (speechUrlRef.current) {
      URL.revokeObjectURL(speechUrlRef.current);
      speechUrlRef.current = null;
    }
    setSpeaking(false);
    setVoiceLoading(false);
  }

  function confirmOathAndSave() {
    setUnlocked(true);
    setStage("meditation");
  }

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#2a0f18",
        color: "#f5ebee",
        fontFamily: "'EB Garamond', Georgia, serif",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        padding: "8vh 6vw",
        position: "relative",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,500;0,600;1,400&display=swap');
        .cinzel { font-family: 'Cinzel', serif; }
        .glow-btn {
          background: linear-gradient(135deg, #0a3d38, #2dd4bf);
          color: #03110f;
          border: 1px solid rgba(238,240,244,0.15);
          padding: 1em 2.2em;
          border-radius: 14px;
          font-family: 'Cinzel', serif;
          font-weight: 700;
          font-size: 0.95rem;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          cursor: pointer;
          transition: filter 0.2s ease;
        }
        .glow-btn:hover { filter: brightness(1.12); }
        .glow-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .ghost-btn {
          background: transparent;
          color: #e8cdd3;
          border: 1px solid rgba(232,205,211,0.35);
          padding: 0.9em 1.9em;
          border-radius: 14px;
          font-family: 'Cinzel', serif;
          font-size: 0.88rem;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          cursor: pointer;
        }
        .field {
          width: 100%;
          background: #3a1620;
          border: 1px solid rgba(232,205,211,0.3);
          color: #f5ebee;
          padding: 1em 1.1em;
          border-radius: 12px;
          font-family: 'EB Garamond', serif;
          font-size: 1.15rem;
        }
        .pair-block {
          border-radius: 12px;
          padding: 1.3rem 1.4rem;
          margin-bottom: 1rem;
          animation: riseIn 0.5s ease;
          text-align: left;
        }
        @keyframes riseIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:translateY(0);} }
        @media (prefers-reduced-motion: reduce) { .pair-block { animation: none; } }
        .audio-row { display:flex; gap:0.7rem; justify-content:center; margin-bottom:1.4rem; flex-wrap: wrap; }
        .audio-btn {
          display:flex; align-items:center; gap:0.4rem;
          background:#3a1620; border:1px solid rgba(77,216,204,0.4);
          color:#e8cdd3; padding:0.7em 1.2em; border-radius:24px;
          font-family:'Cinzel',serif; font-size:0.78rem; letter-spacing:0.05em;
          text-transform:uppercase; cursor:pointer;
        }
        p, li { font-size: 1.12rem; }
      `}</style>

      <GlitterLayer />

      <div style={{ maxWidth: 560, width: "100%", textAlign: "center", position: "relative", zIndex: 1 }}>
        <div className="cinzel" style={{ fontSize: "0.78rem", letterSpacing: "0.28em", color: "#4dd8cc", textTransform: "uppercase", marginBottom: "1.2rem" }}>
          The Magician's Path
        </div>

        {stage === "intro" && (
          <>
            <h1 className="cinzel" style={{ fontSize: "2.1rem", marginBottom: "1.2rem" }}>
              The Draw
            </h1>
            <p style={{ color: "#e8cdd3", fontStyle: "italic", marginBottom: "1.2rem", lineHeight: 1.6 }}>
              We're going to do a tarot read together, gently, to help you see your
              true identity clearly — and what's been quietly standing between you
              and it.
            </p>
            <p style={{ color: "#e8cdd3", marginBottom: "2rem", lineHeight: 1.6 }}>
              Afterward, you'll receive a free guided meditation to lovingly begin
              the alchemy — the identity transformation into the Magician, your
              fully embodied higher self — plus the full beginner's guide to the
              Magician's Path.
            </p>
            <button className="glow-btn" onClick={() => setStage("goal")}>
              Begin <ArrowRight size={16} style={{ verticalAlign: "middle", marginLeft: 6 }} />
            </button>
          </>
        )}

        {stage === "goal" && (
          <>
            <h2 className="cinzel" style={{ fontSize: "1.5rem", marginBottom: "1.4rem" }}>
              Who Are You At Your Highest Potential?
            </h2>
            <p style={{ color: "#e8cdd3", fontStyle: "italic", marginBottom: "1.4rem", lineHeight: 1.6 }}>
              Not a goal. Not an outcome. <strong style={{ color: "#f5ebee" }}>Let your imagination run free.</strong>{" "}
              <strong style={{ color: "#f5ebee" }}>You are worthy, deserving, powerful, and capable of anything.</strong>
            </p>
            <p style={{ color: "#4dd8cc", fontSize: "0.95rem", marginBottom: "0.8rem", fontWeight: 700 }}>
              Include as much detail as possible — the more specific you are, the more this reading can actually speak to you.
            </p>
            <textarea
              className="field"
              rows={4}
              placeholder="Describe that identity in as much detail as possible — how they think, carry themselves, speak, move through the world..."
              value={goal}
              onChange={(e) => setGoal(e.target.value)}
              style={{ marginBottom: "1.2rem" }}
            />
            <div style={{ display: "flex", gap: "0.8rem", justifyContent: "center", flexWrap: "wrap" }}>
              <button className="glow-btn" disabled={!goal.trim()} onClick={() => startDraw(goal)}>
                Draw My Cards
              </button>
              <button className="ghost-btn" onClick={() => setStage("hsv1")}>
                I'm not sure yet
              </button>
            </div>
          </>
        )}

        {stage === "hsv1" && (
          <>
            <h2 className="cinzel" style={{ fontSize: "1.4rem", marginBottom: "1.2rem", lineHeight: 1.5 }}>
              That's okay. Close your eyes, and gently imagine who you'd be at
              your highest potential — with as few limitations as possible.
            </h2>
            <p style={{ color: "#e8cdd3", fontStyle: "italic", marginBottom: "1.4rem" }}>
              Now keep expanding it. Bigger. Freer. Push it until it feels almost
              unbelievable. When you have it, describe who that person is below.
            </p>
            <textarea
              className="field"
              rows={4}
              placeholder="Who are they? How do they think, carry themselves, move through the world?"
              value={hsv.vision}
              onChange={(e) => setHsv({ ...hsv, vision: e.target.value })}
              style={{ marginBottom: "1.2rem" }}
            />
            <button className="glow-btn" disabled={!hsv.vision.trim()} onClick={() => setStage("hsv2")}>
              Continue
            </button>
          </>
        )}

        {stage === "hsv2" && (
          <>
            <h2 className="cinzel" style={{ fontSize: "1.4rem", marginBottom: "1.6rem" }}>
              Take a moment. Is becoming that person worth it, to you?
            </h2>
            <div style={{ display: "flex", gap: "0.8rem", justifyContent: "center" }}>
              <button className="glow-btn" onClick={() => setStage("hsv3")}>Yes</button>
              <button className="ghost-btn" onClick={() => setStage("goal")}>Let me rethink it</button>
            </div>
          </>
        )}

        {stage === "hsv3" && (
          <>
            <h2 className="cinzel" style={{ fontSize: "1.4rem", marginBottom: "1.6rem" }}>
              Would you like to start moving toward becoming them?
            </h2>
            <div style={{ display: "flex", gap: "0.8rem", justifyContent: "center" }}>
              <button className="glow-btn" onClick={() => startDraw(hsv.vision)}>
                Yes — Draw My Cards
              </button>
            </div>
          </>
        )}

        {stage === "reveal" && (
          <>
            <h2 className="cinzel" style={{ fontSize: "1.4rem", marginBottom: "1.6rem" }}>
              Your Cards Are Drawn
            </h2>
            <div style={{ marginBottom: "1.8rem" }}>
              {pairs.map((pair, stepIdx) => (
                <div
                  key={stepIdx}
                  className="pair-block"
                  style={{ background: "#3a1620", border: `1.5px solid ${STEPS[stepIdx].color}88` }}
                >
                  <div className="cinzel" style={{ fontSize: "0.8rem", color: STEPS[stepIdx].color, letterSpacing: "0.1em", marginBottom: "0.7rem" }}>
                    {STEPS[stepIdx].label}
                  </div>
                  <div style={{ display: "flex", gap: "1.2rem", flexWrap: "wrap" }}>
                    {pair.map((c, i) => (
                      <div key={i} style={{ flex: "1 1 45%" }}>
                        <div className="cinzel" style={{ fontSize: "1.05rem" }}>{c.n}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
            <p style={{ color: "#4dd8cc", fontWeight: 700, fontSize: "1.15rem", marginBottom: "1.6rem" }}>
              Your results are ready.
            </p>
            <input
              type="text"
              className="field"
              placeholder="Your name"
              value={nameInput}
              onChange={(e) => setNameInput(e.target.value)}
              style={{ marginBottom: "1rem" }}
            />
            <input
              type="email"
              className="field"
              placeholder="you@email.com"
              value={emailInput}
              onChange={(e) => setEmailInput(e.target.value)}
              style={{ marginBottom: "1.4rem" }}
            />
            <button
              className="glow-btn"
              disabled={!emailInput.includes("@") || !nameInput.trim()}
              onClick={submitEmailGate}
            >
              See My Reading
            </button>
          </>
        )}

        {stage === "reading" && (
          <>
            {loading && (
              <div style={{ padding: "3rem 0" }}>
                <Loader2 size={30} style={{ color: "#4dd8cc", animation: "spin 1.2s linear infinite" }} />
                <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
                <p style={{ color: "#e8cdd3", fontStyle: "italic", marginTop: "1rem" }}>Reading the cards...</p>
              </div>
            )}
            {error && (
              <>
                <p style={{ color: "#e05a78", marginBottom: "1rem" }}>{error}</p>
                <button className="glow-btn" onClick={() => generateReading(goal)}>Try Again</button>
              </>
            )}
            {reading && !loading && (
              <>
                <h2 className="cinzel" style={{ fontSize: "1.4rem", marginBottom: "1.2rem" }}>Your Reading</h2>
                {savedCode && (
                  <p style={{ background: "rgba(77,216,204,0.12)", border: "1px solid rgba(77,216,204,0.4)", borderRadius: 10, padding: "0.8rem 1rem", color: "#4dd8cc", fontWeight: 700, fontSize: "1rem", marginBottom: "1.4rem" }}>
                    Copy this page's link now — it's already saved, and brings you straight back to this exact reading anytime.
                  </p>
                )}
                <div style={{ textAlign: "left", marginBottom: "1.6rem" }}>
                  <div className="cinzel" style={{ fontSize: "0.85rem", color: STEPS[0].color, letterSpacing: "0.08em", marginBottom: "0.4rem" }}>{STEPS[0].label}</div>
                  <p style={{ color: "#f5ebee", lineHeight: 1.75, marginBottom: "1.3rem" }}>{reading.archetype}</p>
                  <div className="cinzel" style={{ fontSize: "0.85rem", color: STEPS[1].color, letterSpacing: "0.08em", marginBottom: "0.4rem" }}>{STEPS[1].label}</div>
                  <p style={{ color: "#f5ebee", lineHeight: 1.75, marginBottom: "1.3rem" }}>{reading.blocking}</p>
                  <div className="cinzel" style={{ fontSize: "0.85rem", color: STEPS[2].color, letterSpacing: "0.08em", marginBottom: "0.4rem" }}>{STEPS[2].label}</div>
                  <p style={{ color: "#f5ebee", lineHeight: 1.75, marginBottom: "1.3rem" }}>{reading.pathForward}</p>
                  <div className="cinzel" style={{ fontSize: "0.85rem", color: STEPS[3].color, letterSpacing: "0.08em", marginBottom: "0.4rem" }}>{STEPS[3].label}</div>
                  <p style={{ color: "#f5ebee", lineHeight: 1.75 }}>{reading.whoYouBecome}</p>
                </div>
                <button className="glow-btn" onClick={() => setStage("oath")}>
                  Receive Your Meditation
                </button>
              </>
            )}
          </>
        )}

        {stage === "oath" && (
          <>
            <h2 className="cinzel" style={{ fontSize: "1.4rem", marginBottom: "1.2rem" }}>
              Speak This Aloud
            </h2>
            <div style={{ background: "#3a1620", border: "1px solid rgba(77,216,204,0.35)", borderRadius: 14, padding: "1.6rem", marginBottom: "1.6rem" }}>
              <p style={{ fontStyle: "italic", color: "#f5ebee", fontSize: "1.2rem", lineHeight: 1.7, margin: 0 }}>
                "{OATH}"
              </p>
            </div>
            <label style={{ display: "flex", alignItems: "center", gap: "0.7rem", justifyContent: "center", marginBottom: "1.6rem", cursor: "pointer" }}>
              <input type="checkbox" checked={oathChecked} onChange={(e) => setOathChecked(e.target.checked)} style={{ width: 20, height: 20 }} />
              <span style={{ color: "#e8cdd3" }}>I have spoken this aloud</span>
            </label>
            <button
              className="glow-btn"
              disabled={!oathChecked}
              onClick={confirmOathAndSave}
            >
              Confirm &amp; Receive
            </button>
          </>
        )}

        {stage === "meditation" && unlocked && (
          <>
            <h2 className="cinzel" style={{ fontSize: "1.4rem", marginBottom: "1rem" }}>Your Meditation</h2>
            <p style={{ color: "#e8cdd3", marginBottom: "1rem", fontStyle: "italic" }}>
              Sit down. Get comfortable. Let yourself settle in fully. Make sure
              you are not operating any machinery.
            </p>
            {savedCode && (
              <p style={{ background: "rgba(77,216,204,0.12)", border: "1px solid rgba(77,216,204,0.4)", borderRadius: 10, padding: "0.8rem 1rem", color: "#4dd8cc", fontWeight: 700, fontSize: "1rem", marginBottom: "1.2rem" }}>
                Copy this page's link now — it's your way back, every day, for the next eight days.
              </p>
            )}
            {voiceError && (
              <p style={{ color: "#e05a78", fontSize: "0.9rem", marginBottom: "1rem" }}>
                {voiceError}
              </p>
            )}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "0.7rem", marginBottom: "1.2rem" }}>
              <Volume2 size={14} style={{ color: "#e8cdd3" }} />
              <input
                type="range"
                min="0"
                max="1"
                step="0.02"
                value={toneVolume}
                onChange={(e) => handleVolumeChange(Number(e.target.value))}
                style={{ width: 160 }}
              />
              <span style={{ color: "#e8cdd3", fontSize: "0.85rem" }}>{Math.round(toneVolume * 100)}%</span>
            </div>
            <div className="audio-row">
              <button className="audio-btn" onClick={tonePlaying ? stopTone : startTone}>
                {tonePlaying ? <Square size={13} /> : <Volume2 size={13} />}
                {tonePlaying ? "Stop Tone" : "Play Healing Tone"}
              </button>
              <button className="audio-btn" onClick={speaking ? stopSpeaking : speakMeditation}>
                {speaking ? <Square size={13} /> : <Play size={13} />}
                {speaking ? (voiceLoading ? "Loading..." : "Stop Reading") : "Read To Me"}
              </button>
              <button
                className="audio-btn"
                onClick={() => {
                  const blob = new Blob([meditation], { type: "text/plain" });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement("a");
                  a.href = url;
                  a.download = "my-identity-meditation.txt";
                  a.click();
                  URL.revokeObjectURL(url);
                }}
              >
                <Download size={13} /> Save as Text
              </button>
            </div>
            {meditationParts ? (
              <div style={{ textAlign: "left", marginBottom: "2rem" }}>
                <p style={{ color: "#f5ebee", lineHeight: 1.85, whiteSpace: "pre-line", marginBottom: "1.2rem" }}>
                  {meditationParts.inductionPre}
                  <br /><br />
                  {meditationParts.inductionCount}
                  <br /><br />
                  {meditationParts.inductionPost}
                </p>
                <p style={{ color: "#f5ebee", lineHeight: 1.85, whiteSpace: "pre-line", marginBottom: "1.2rem" }}>
                  {meditationParts.voidLight}
                </p>
                <p style={{ color: "#f5ebee", lineHeight: 1.85, whiteSpace: "pre-line", marginBottom: "1.2rem" }}>
                  {meditationParts.visualization}
                </p>
                <p style={{ color: "#f5ebee", lineHeight: 1.85, whiteSpace: "pre-line", marginBottom: "1.2rem" }}>
                  <strong style={{ color: "#4dd8cc" }}>{meditationParts.anchor}</strong>
                </p>
                <p style={{ color: "#f5ebee", lineHeight: 1.85, whiteSpace: "pre-line" }}>
                  {meditationParts.closingPre}
                  <br /><br />
                  {meditationParts.closingCount}
                  <br /><br />
                  {meditationParts.closingPost}
                  <br /><br />
                  <strong style={{ color: "#4dd8cc" }}>
                    {meditationParts.reminder}
                  </strong>
                  <br /><br />
                  {meditationParts.reciprocity}
                </p>
              </div>
            ) : (
              <p style={{ color: "#f5ebee", lineHeight: 1.85, textAlign: "left", whiteSpace: "pre-line", marginBottom: "2rem" }}>
                {meditation}
              </p>
            )}
            <div style={{ background: "#3a1620", border: "1px solid rgba(77,216,204,0.3)", borderRadius: 14, padding: "1.3rem 1.5rem", marginBottom: "1.8rem" }}>
              <p style={{ color: "#e8cdd3", fontStyle: "italic", marginBottom: "0.9rem" }}>
                This is free. If it moved something in you, consider sending $8.88 back
                into the exchange — the law of reciprocity helps the universe respond to
                your desires, and the number 888 carries a resonance that summons your
                higher self.
              </p>
              <a
                href="https://buy.stripe.com/bJeaEX1eO8BactZ8tidAk02"
                target="_blank"
                rel="noopener noreferrer"
                className="ghost-btn"
                style={{ textDecoration: "none", display: "inline-block" }}
              >
                Send $8.88
              </a>
            </div>
            <p style={{ color: "#e8cdd3", fontStyle: "italic", marginBottom: "0.8rem" }}>
              Your full beginner's guide, and an opportunity to go deeper into your
              new identity, has been sent to your email.
            </p>
            <p style={{ color: "#4dd8cc", fontWeight: 700 }}>
              One last reminder — save this page's link now, so you can return to
              your meditation every day, for the next eight days.
            </p>
          </>
        )}
      </div>
    </div>
  );
}

const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<TarotDraw />);
</script>
